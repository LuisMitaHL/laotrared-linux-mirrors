# Overrides the file the linuxserver image auto-generates on first start.
#
# WHY PUBLIC RESOLVERS AND NOT 127.0.0.11
# ---------------------------------------
# The image's resolver.conf is written from the container's /etc/resolv.conf,
# i.e. Docker's embedded DNS, which forwards to whatever the *host* uses. On
# this network the host uses the LAN resolver - and the whole point of
# transparent mode is that the LAN resolver sends deb.debian.org,
# archive.ubuntu.com, ... back to THIS box. Put those two facts together and
# nginx resolves a mirror name to the cache itself: every upstream request
# becomes a request to itself, and the cache proxies in a loop until the client
# times out (or the box runs out of file descriptors). Public resolvers remove
# that failure mode entirely - the answer is the real mirror, never the cache.
#
# This is the only DNS path nginx uses for upstreams, so keep the list honest.
# Addresses are queried round-robin; one dead resolver costs one failed lookup,
# and a dead lookup is retried against the next one.
#
# ipv6=off is deliberate: with `resolve` in an upstream block nginx also
# resolves AAAA records and tries them; on a v4-only network each attempt fails
# with "connect() ... 101: Network unreachable" before falling back to IPv4,
# which burns the proxy_next_upstream_tries budget and can 502 a file that does
# exist. Re-enable it only when the cache box really has IPv6.
#
# valid=30s: mirrors change DNS more often than nginx's default answer TTL;
# 30s is a fine trade-off for a package cache and stops a moved mirror from
# lingering for minutes.
#
# NOTE: no second `resolver` may be declared for this context - nginx.conf
# already includes this file inside http{}, and a duplicate is a hard error.
resolver 1.1.1.1 9.9.9.9 149.112.112.112 8.8.8.8 valid=30s ipv6=off;
resolver_timeout 3s;
