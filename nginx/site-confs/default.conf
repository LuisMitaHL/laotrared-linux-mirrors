## Version 2026/06/27 - based on the linuxserver site-conf sample; customised
## into a package-cache vhost (the date keeps the image's "conf out of date"
## warning quiet - bump it if you update from a newer sample).
# ---------------------------------------------------------------------------
# Package cache gateway for Debian / Ubuntu / Arch Linux.
#
# This file lives at /config/nginx/site-confs/default.conf in the
# lscr.io/linuxserver/nginx image. That image's /config/nginx/nginx.conf ends
# with `include /config/nginx/site-confs/*.conf;` inside `http {}`, so
# everything below is evaluated in http context - which is why proxy_cache_path,
# map, upstream and log_format are all legal here.
#
# ONE cache zone, TWO client modes. The cache path is byte-identical to the
# upstream path, which is what makes both modes share the same files.
#
#   A) PREFIX mode  (default server; any client hostname works)
#        Debian : URIs: http://cache.lan/debian               # deb822
#        Debian : deb http://cache.lan/debian trixie main     # one-line
#        Ubuntu : URIs: http://cache.lan/ubuntu
#        Arch   : Server = http://cache.lan/archlinux/$repo/os/$arch
#
#   B) TRANSPARENT mode (DNS sends the real mirror hostname here)
#        client asks http://deb.debian.org/debian/...  -> lands in this box
#        with "Host: deb.debian.org"; the hostname selects the upstream and
#        the path is forwarded unchanged.  See "transparent" server below.
#
# Not supported: HTTPS clients. nginx cannot MITM TLS, and Arch's mirrorlist
# is https-only, so Arch always uses prefix mode (or edit the mirrorlist).
#
# NOTE: do not add a `resolver` line here. The linuxserver init writes
# /config/nginx/resolver.conf (docker's 127.0.0.11 by default) and nginx.conf
# includes it into http{} already; declaring a second one is a duplicate error.
# ---------------------------------------------------------------------------

# ---- request log ----------------------------------------------------------
# cache status is the whole point: MISS/HIT/STALE/REVALIDATED/UPDATING
# $msec = request start (epoch.milliseconds), so start+duration shows overlap:
#   awk '$3-d>prev {print "parallel"} {prev=$3}' -> whether downloads overlapped
log_format cache '$remote_addr "$host$request_uri" $msec $status $request_time '
                 '$upstream_cache_status "$upstream_addr" $body_bytes_sent';

# ---- disk budget ----------------------------------------------------------
# max_size = hard cap, enforced by the cache manager with LRU eviction
# min_free = always keep this much free on the filesystem
# inactive = drop entries not requested for this long (default is 10 minutes!)
# /cache is its own bind mount: the image owns /config, the packages are ours.
proxy_cache_path /cache/pkg
                 levels=1:2
                 keys_zone=pkg:80m
                 max_size=200g
                 min_free=10g
                 inactive=45d
                 use_temp_path=off;

# Host is part of the key: the same path on two mirrors is a different object
# (ports.ubuntu.com and archive.ubuntu.com both have /ubuntu/dists/...), and
# it keeps prefix mode and transparent mode from colliding.
proxy_cache_key "$host$request_uri";

# ---- prefix mode: request path -> upstream --------------------------------
# Value is a hostname (resolved at runtime) or an upstream block name.
# "none" => not a repository path we know, answer 404 instead of proxying
# (this is also what stops the box from becoming an open proxy).
# A value that names an `upstream` block (the *_mirrors entries) is balanced
# across that whole group; a bare hostname means "always this one host".
# debian-security has a single origin, and ubuntu-ports has few mirrors, so
# those two stay pinned to their canonical hostname.
map $uri $path_target {
    default              none;
    ~^/debian-security/  security.debian.org;
    ~^/debian/           debian_mirrors;
    ~^/ubuntu-ports/     ports.ubuntu.com;
    ~^/ubuntu/           ubuntu_mirrors;
    ~^/archlinux/        arch_mirrors;
}

# `map $target $target_host` (which Host header each pool is served under)
# lives in the generated mirrors.conf, right after the pools, so the Host that
# the probe tested and the Host nginx sends cannot drift apart.

# ---------------------------------------------------------------------------
# Upstream policy, identical for every group generated in mirrors.conf:
#
#   random two least_conn   pick two peers at random (weighted), send the
#                           request to the less busy one. Spreads load without
#                           hammering a slow mirror, which plain round-robin
#                           would do.
#   max_fails / fail_timeout  passive health check: a peer that errors twice is
#                           parked for 60s. NOTE: a 404 is deliberately NOT a
#                           failure, so "this mirror has not synced that file
#                           yet" never blacklists a healthy mirror - it just
#                           hops to the next one via proxy_next_upstream.
#   resolve + zone          re-resolve DNS at runtime (the CDN name rotates
#                           IPs). Needs the http-level resolver, which comes from
#                           nginx/resolver.conf (mounted over the one the
#                           image generates, because that one lacks ipv6=off).
#   weight                  relative measured throughput inside the pool, with
#                           a small bonus for tier-1/origin sources.
#   keepalive               reuse upstream connections instead of a new TCP
#                           handshake per package.
#
# The pools themselves are GENERATED, not hand-written: tools/scan-mirrors.py
# discovers mirrors from each distro's own list, gates them on freshness,
# measures real throughput against a fixed byte budget, and writes
# nginx/mirrors.conf. Re-run it (weekly) instead of editing here - see
# research/PLAN.md section 7 for the ranking rules and the knobs.
#
# Consequences worth knowing before you touch this file:
#   * every peer in a pool must serve the archive at the SAME path root
#     (/debian, /ubuntu, /archlinux), because one `proxy_pass` prefix serves
#     the whole group and nginx cannot rewrite per selected peer;
#   * HTTPS peers cannot be mixed in: the scheme lives on proxy_pass, not on
#     the server line. Adding an https-only CDN (e.g. fastly.mirror.pkgbuild.com,
#     which 301s every plain-HTTP request) means a second published prefix.
#
# `down` on a server line parks a peer without deleting it; a bare hostname
# instead of a group name in map $uri $path_target pins that prefix to one host.
# ---------------------------------------------------------------------------

include /config/nginx/mirrors.conf;

# ===========================================================================
# A) PREFIX mode - works for every client hostname (cache.lan, IP, ...)
# ===========================================================================
server {
    listen 80 default_server;
    server_name _;

    set $target $path_target;

    access_log /config/log/nginx/cache.log cache;

    include /config/nginx/snippets/locations.inc;
}

# ===========================================================================
# B) TRANSPARENT mode - DNS redirects these names to the cache box.
#    Add every mirror hostname you redirect, nothing else is accepted.
# ===========================================================================
server {
    listen 80;
    server_name deb.debian.org
                security.debian.org
                ftp.debian.org
                ftp.us.debian.org
                archive.ubuntu.com
                security.ubuntu.com
                ports.ubuntu.com;

    set $target $host;

    access_log /config/log/nginx/cache.log cache;

    include /config/nginx/snippets/locations.inc;
}
